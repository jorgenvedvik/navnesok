<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Navnesøk – minimum</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Samme fargesystem som hovedsiden */
    :root {
      --bg: #f8f8f6; --surface: #ffffff; --surface-2: #f2f2ef;
      --ink: #0e0f12; --ink-2: #2b2d33; --muted: #6a6d75;
      --line: #e6e5e0; --line-strong: #d4d3cc;
      --accent: #3d45d6; --glow: rgba(61, 69, 214, .14);
      --ledig: #12784a; --opptatt: #b42a1f; --konflikt: #9a5b00; --ulovlig: #5d6068;
      --noytral: #3f4a5c;
      --shadow: 0 1px 2px rgba(14,15,18,.04), 0 8px 24px -12px rgba(14,15,18,.12);
      --radius: 18px;
      --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0b0c0f; --surface: #131419; --surface-2: #1a1c22; --ink: #f2f2f0; --ink-2: #d6d6d2;
        --muted: #9a9ca3; --line: #24262d; --line-strong: #30333b; --accent: #8b91ff; --glow: rgba(139,145,255,.16);
        --ledig: #4fd18f; --opptatt: #ff8a7d; --konflikt: #f5b84d; --ulovlig: #a9abb2; --noytral: #b4bccb;
        --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 32px -16px rgba(0,0,0,.6);
      }
    }
    :root[data-theme="dark"] {
      --bg: #0b0c0f; --surface: #131419; --surface-2: #1a1c22; --ink: #f2f2f0; --ink-2: #d6d6d2;
      --muted: #9a9ca3; --line: #24262d; --line-strong: #30333b; --accent: #8b91ff; --glow: rgba(139,145,255,.16);
      --ledig: #4fd18f; --opptatt: #ff8a7d; --konflikt: #f5b84d; --ulovlig: #a9abb2; --noytral: #b4bccb;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 32px -16px rgba(0,0,0,.6);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; font-feature-settings: "cv11", "ss01"; }
    a { color: inherit; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
    .wrap { max-width: 800px; margin: 0 auto; padding: 0 16px; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    .testbanner { font-size: 13px; color: var(--muted); text-align: center; padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--surface); }
    .testbanner b { color: var(--ink); font-weight: 600; }
    .topp { display: flex; align-items: center; justify-content: space-between; height: 64px; }
    .logo { display: inline-flex; color: var(--ink); }
    .logo svg { height: 24px; width: auto; display: block; }
    .ikonknapp { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }

    h1 { font-size: clamp(32px, 6vw, 48px); line-height: 1.05; letter-spacing: -.035em; font-weight: 700; margin: 40px 0 20px; }
    .sok { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 16px; padding: 6px 6px 6px 16px; box-shadow: var(--shadow); }
    .sok:focus-within { border-color: var(--accent); box-shadow: var(--shadow), 0 0 0 5px var(--glow); }
    .sok input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--ink); font: inherit; font-size: 18px; padding: 12px 4px; }
    .sok input::placeholder { color: var(--muted); }
    .sok input::-webkit-search-cancel-button { display: none; }
    .sok button { flex: none; font: inherit; font-weight: 600; font-size: 15px; cursor: pointer; background: var(--ink); color: var(--bg); border: 0; border-radius: 11px; padding: 13px 20px; }
    .feil { color: var(--opptatt); font-size: 14px; margin-top: 8px; }
    .feil:empty { display: none; }

    #resultater { margin: 32px 0 80px; display: grid; gap: 20px; scroll-margin-top: 16px; }

    /* Resultatkort: tone styrer stripen til venstre og områdeetiketten */
    .kort { --tone: var(--line-strong); position: relative; background: var(--surface); border: 1px solid var(--line); border-left: 6px solid var(--tone); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; animation: inn .35s cubic-bezier(.2,.8,.2,1); }
    @keyframes inn { from { opacity: 0; transform: translateY(8px); } }
    .kort[data-tone="ok"] { --tone: var(--ledig); }
    .kort[data-tone="stopp"] { --tone: var(--opptatt); }
    .kort[data-tone="sjekk"] { --tone: var(--konflikt); }
    .kort[data-tone="noytral"] { --tone: var(--noytral); }
    .kort[data-tone="ukjent"] { --tone: var(--ulovlig); }
    .kort-hoved { padding: 28px 28px 24px; }
    .omrade { display: flex; align-items: center; gap: 10px; margin: 0 0 14px; font-size: 13px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--tone); }
    .kort[data-tone="ukjent"] .omrade, .kort:not([data-tone]) .omrade { color: var(--muted); }
    .omrade svg { flex: none; }
    .kort h2 { margin: 0; font-size: clamp(22px, 3.4vw, 28px); line-height: 1.2; letter-spacing: -.025em; font-weight: 650; overflow-wrap: anywhere; }
    .kort-tekst { margin: 8px 0 0; font-size: 16px; color: var(--ink-2); }
    .kort-tekst b { font-weight: 600; }

    /* Områdevalg for varemerke – kort og kompakt, rett i kortet */
    .omr { margin-top: 20px; }
    .omr-tittel { display: block; font-size: 14px; font-weight: 600; margin-bottom: 10px; }
    .omr-valg { display: flex; flex-wrap: wrap; gap: 8px; }
    .omr-valg button { font: inherit; font-size: 14px; color: var(--ink-2); background: var(--surface); border: 1px solid var(--line-strong); border-radius: 999px; padding: 7px 14px; cursor: pointer; transition: border-color .15s, background .15s; }
    .omr-valg button:hover { border-color: var(--ink); }
    .omr-valg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

    /* Detaljer */
    .detaljer { border-top: 1px solid var(--line); }
    .detaljer summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 28px; }
    .detaljer summary::-webkit-details-marker { display: none; }
    .detaljer summary b { display: block; font-size: 17px; font-weight: 600; color: var(--accent); }
    .detaljer summary small { display: block; font-size: 14px; color: var(--muted); }
    .pil-ned { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line-strong); display: grid; place-items: center; color: var(--accent); transition: transform .2s; }
    .detaljer[open] .pil-ned { transform: rotate(180deg); }
    .detaljer summary:hover .pil-ned { border-color: var(--accent); }
    .treff { list-style: none; margin: 0; padding: 0 28px 20px; }
    .treff li { display: flex; justify-content: space-between; gap: 16px; padding: 12px 0; border-top: 1px solid var(--line); font-size: 15px; }
    .treff li:first-child { border-top: 0; padding-top: 0; }
    .treff .navn { font-weight: 600; overflow-wrap: anywhere; }
    .treff .meta { display: block; font-size: 13px; color: var(--muted); }
    .treff .merk { flex: none; font-size: 13px; color: var(--muted); text-align: right; }
    .treff .merk.din { color: var(--ink); font-weight: 600; }
    .treff-mer { margin: -8px 28px 20px; font-size: 13px; color: var(--muted); }

    /* Anbefalt neste steg */
    .neste { background: var(--surface-2); border-top: 1px solid var(--line); padding: 22px 28px 26px; }
    .neste h3 { margin: 0 0 14px; font-size: 16px; font-weight: 600; }
    .neste-rad { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 28px; }
    .knapp { display: inline-flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600; color: var(--bg); background: var(--ink); text-decoration: none; padding: 14px 24px; border-radius: 999px; transition: opacity .15s; }
    .knapp:hover { opacity: .88; }
    .lenke { display: inline-flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 500; color: var(--accent); text-underline-offset: 4px; }
    .lenke:hover { text-decoration-thickness: 2px; }

    .skjelett { height: 16px; border-radius: 6px; margin: 10px 0; background: linear-gradient(90deg, var(--surface-2) 25%, var(--line) 50%, var(--surface-2) 75%); background-size: 200% 100%; animation: glimt 1.2s linear infinite; }
    .skjelett.stor { height: 26px; width: 70%; }
    .skjelett.kort-s { width: 45%; }
    @keyframes glimt { to { background-position: -200% 0; } }

    @media (max-width: 600px) {
      .kort-hoved { padding: 22px 20px 20px; }
      .detaljer summary { padding: 16px 20px; }
      .treff { padding: 0 20px 18px; }
      .treff-mer { margin: -6px 20px 18px; }
      .neste { padding: 20px 20px 22px; }
      .knapp { width: 100%; justify-content: center; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <div class="testbanner" role="note"><b>Testversjon.</b> Minimumsvariant av Navnesøk – ikke den offisielle tjenesten.</div>

      <button class="ikonknapp" id="tema" type="button" aria-label="Bytt mellom lys og mørk modus"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    </header>

    <main>
      <h1>Er navnet ledig?</h1>
      <form id="sokForm" novalidate role="search">
        <label class="sr" for="sokFelt">Skriv inn navnet du vil sjekke</label>
        <div class="sok">
          <input id="sokFelt" type="search" autocomplete="off" spellcheck="false" placeholder="Skriv inn et navn …" aria-describedby="sokFeil">
          <button type="submit">Sjekk navnet</button>
        </div>
        <div class="feil" id="sokFeil" role="alert"></div>
      </form>
      <div id="resultater" aria-live="polite"></div>
    </main>
  </div>

  <script>
    const root = document.documentElement;
    try { const t = localStorage.getItem('tema'); if (t) root.dataset.theme = t; } catch {}
    document.getElementById('tema').addEventListener('click', () => {
      const mork = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      root.dataset.theme = mork ? 'light' : 'dark';
      try { localStorage.setItem('tema', root.dataset.theme); } catch {}
    });

    const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
    const norm = s => String(s).toLowerCase().replace(/[^a-z0-9æøå]/g, '');
    const PIL = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>';
    const NED = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';
    const ik = p => `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
    const OMRADE = {
      domene: { navn: 'Domene', ikon: ik('<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>') },
      foretak: { navn: 'Foretaksnavn', ikon: ik('<path d="M4 21V5l8-2v18M12 8h8v13M2 21h20"/>') },
      vare: { navn: 'Varemerke', ikon: ik('<path d="M12 3 4.5 6v5.5c0 4.6 3.2 8.4 7.5 9.5 4.3-1.1 7.5-4.9 7.5-9.5V6z"/><path d="m8.8 12 2.2 2.2 4.2-4.4"/>') }
    };

    /* Registersøk */
    const SOK_URL = {
      domene: d => `https://www.norid.no/no/domeneoppslag/hvem-har-domenenavnet/?query=${encodeURIComponent(d)}`,
      foretak: n => `https://virksomhet.brreg.no/nb/oppslag/enheter?navn=${encodeURIComponent(n)}`,
      vare: n => `https://search.patentstyret.no/advanced/#/trademark?cs=${encodeURIComponent(n)}`
    };
    const LENKE = {
      forhandler: 'https://www.norid.no/',
      norid_regler: 'https://www.norid.no/no/regelverk/navnepolitikk/',
      brreg: 'https://www.brreg.no/',
      foretaksnavn: 'https://www.brreg.no/bedrift/foretaksnavn/',
      veiledning: 'https://www.patentstyret.no/varemerke/tjenester/gratis-veiledning',
      soknad: 'https://www.patentstyret.no/varemerke/forbered-varemerkesoknad',
      saerpreg: '/om-tjenesten/#varemerke'
    };

    /* Områder (forenklet inngang til Nice-klassene) */
    const KATEGORIER = [
      { navn: 'Mat og drikke', k: [29, 30, 31, 32, 33, 43] },
      { navn: 'Klær og skjønnhet', k: [3, 10, 14, 18, 25, 26, 44] },
      { navn: 'Teknologi og digitalt', k: [9, 38, 42] },
      { navn: 'Handel og rådgivning', k: [35, 36, 45] },
      { navn: 'Bygg, industri og transport', k: [1, 2, 4, 6, 7, 8, 11, 12, 17, 19, 37, 39, 40] },
      { navn: 'Helse og medisin', k: [5, 13] },
      { navn: 'Fritid, kultur og utdanning', k: [15, 16, 28, 41] },
      { navn: 'Hjem og interiør', k: [20, 21, 22, 23, 24, 27, 34] }
    ];
    let katValgt = new Set(), valgte = new Set();

    /* Demo-data – brukes når demo-modus er slått på (på hovedsiden eller med ?demo=1) */
    const D = (merke, klasser, ekstra = {}) => ({ merke, klasser, aktiv: true, ...ekstra });
    const DEMO = {
      fjellbris: [D('FJELLBRIS', [25, 18], { eier: 'Fjellbris Friluft AS' }), D('FJELLBRIS', [25, 35], { eier: 'Fjellbris Friluft AS' }), D('FJELLBRIS', [3], { eier: 'Bris Kosmetikk AS', aktiv: false })],
      nordlys: [D('NORDLYS', [43], { eier: 'Nordlys Servering AS' }), D('NORDLYS', [43, 30], { eier: 'Nordlys Servering AS' }), D('NORDLYS', [32], { eier: 'Arktisk Bryggeri AS' }), D('NORDLYS', [41], { eier: 'Nordlys Kultur' }), D('NORDLYSET', [16], { eier: 'Avishuset Nord AS' })],
      equinor: [D('EQUINOR', Array.from({ length: 45 }, (_, i) => i + 1).filter(k => ![5, 25, 26, 33, 34].includes(k)), { eier: 'Equinor ASA' }), D('EQUINOR', [5], { eier: 'Eksempel Legemidler Ltd' }), D('EQUINOX', [25], { eier: 'Equinox Sport AS' })],
      equinir: [D('EQUINOR', [1, 4, 9, 35, 37, 39, 40, 42], { eier: 'Equinor ASA' })],
      solvind: [D('SOLVINN', [4, 11], { eier: 'Solvinn Energi AS' })],
      zyntrova: []
    };
    const params = new URLSearchParams(location.search);
    let demo = params.get('demo') === '1';
    try { if (!params.has('demo')) demo = localStorage.getItem('demo') === '1'; } catch {}
    const demoVare = navn => new Promise(r => setTimeout(() => { const t = (DEMO[norm(navn)] || []).map(x => ({ ...x })); r({ treff: t, antallTotalt: t.length }); }, 400));

    async function hent(sti, navn) {
      const r = await fetch(`/api/${sti}?navn=${encodeURIComponent(navn)}`);
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.feil || `Feil ${r.status}`);
      return data;
    }

    /* ---------- Kortet ----------
       Ett kort per register: område, overskrift (svaret), én setning, valgfrie detaljer og anbefalt neste steg. */
    function kortHtml(k, s) {
      const steg = s.steg || [];
      const [hoved, ...andre] = steg;
      return `
        <article class="kort" id="kort-${k}" data-tone="${s.tone}" aria-labelledby="t-${k}">
          <div class="kort-hoved">
            <p class="omrade">${OMRADE[k].ikon}${OMRADE[k].navn}</p>
            <h2 id="t-${k}">${s.tittel}</h2>
            ${s.tekst ? `<p class="kort-tekst">${s.tekst}</p>` : ''}
            ${s.ekstra || ''}
          </div>
          ${s.detaljer ? `<details class="detaljer"${s.apen ? ' open' : ''}>
            <summary><span><b>Vis detaljer</b><small>Hva vi fant</small></span><span class="pil-ned">${NED}</span></summary>
            ${s.detaljer}
          </details>` : ''}
          ${hoved ? `<div class="neste">
            <h3>Anbefalt neste steg</h3>
            <div class="neste-rad">
              <a class="knapp" href="${hoved[0]}"${ekstern(hoved[0])}>${hoved[1]}${ekstern(hoved[0]) ? PIL : ''}</a>
              ${andre.map(([u, t]) => `<a class="lenke" href="${u}"${ekstern(u)}>${t}${ekstern(u) ? PIL : ''}</a>`).join('')}
            </div>
          </div>` : ''}
        </article>`;
    }
    const ekstern = u => /^https?:/.test(u) ? ' target="_blank" rel="noopener"' : '';
    const lasterHtml = k => `
      <article class="kort" id="kort-${k}" aria-busy="true">
        <div class="kort-hoved"><p class="omrade">${OMRADE[k].ikon}${OMRADE[k].navn}</p><div class="skjelett stor"></div><div class="skjelett kort-s"></div></div>
      </article>`;
    const sett = (k, s) => { const el = document.getElementById('kort-' + k); if (el) el.outerHTML = kortHtml(k, s); };
    const ukjent = (k, hvor, url) => ({ tone: 'ukjent', tittel: `Vi fikk ikke sjekket ${k}`, tekst: `${hvor} svarte ikke akkurat nå. Prøv igjen om litt.`, steg: [[url, `Søk selv hos ${hvor}`]] });

    /* Domene */
    function domene(d, navn) {
      const dom = esc(d.domene);
      if (d.status === 'ledig') return { tone: 'ok', tittel: `${dom} er ledig`, tekst: 'Den som registrerer domenet først, får det.', steg: [[LENKE.forhandler, 'Finn en forhandler']] };
      if (d.status === 'opptatt') return { tone: 'stopp', tittel: `${dom} er tatt`, tekst: 'Prøv en variant, for eksempel med bindestrek eller et ekstra ord.', steg: [[SOK_URL.domene(d.domene), 'Se domenet hos Norid']] };
      if (d.status === 'ulovlig') return { tone: 'stopp', tittel: 'Navnet kan ikke brukes som domene', tekst: esc(d.melding || 'Navnet inneholder tegn som ikke er tillatt i et .no-domene.'), steg: [[LENKE.norid_regler, 'Les Norids regler']] };
      return ukjent('domenet', 'Norid', SOK_URL.domene(d.domene || navn));
    }

    /* Foretaksnavn */
    function foretak(d, navn) {
      const liste = (d.treff || []).map(t => `<li><span><span class="navn">${esc(t.navn)}</span><span class="meta">Org.nr. ${esc(t.orgnr)}${t.form ? ' · ' + esc(t.form) : ''}</span></span><span class="merk${t.lik && !t.slettet ? ' din' : ''}">${t.slettet ? 'Slettet' : t.lik ? 'Likt navn' : 'Lignende navn'}</span></li>`).join('');
      const detaljer = liste ? `<ul class="treff">${liste}</ul>${d.antallTotalt > d.treff.length ? `<p class="treff-mer">Viser ${d.treff.length} av ${d.antallTotalt}.</p>` : ''}` : '';
      if (d.status === 'ledig') return { tone: 'ok', tittel: 'Ingen foretak har dette navnet', tekst: 'Navnet blir ditt når du registrerer foretaket.', steg: [[LENKE.brreg, 'Registrer foretaket']] };
      if (d.status === 'opptatt') return { tone: 'stopp', tittel: 'Et foretak har allerede dette navnet', tekst: 'Foretaksnavnet ditt må skille seg tydelig fra navn som er registrert.', detaljer, steg: [[SOK_URL.foretak(navn), 'Se foretaket hos Brønnøysundregistrene'], [LENKE.foretaksnavn, 'Les om foretaksnavn']] };
      return { tone: 'sjekk', tittel: 'Foretak med lignende navn finnes', tekst: 'Navnet ditt må skille seg tydelig fra dem. Se om de ligner for mye.', detaljer, steg: [[SOK_URL.foretak(navn), 'Se treffene hos Brønnøysundregistrene'], [LENKE.foretaksnavn, 'Les om foretaksnavn']] };
    }

    /* Varemerke – positive svar er alltid nøytrale (grå), aldri grønne */
    let vareData = null;
    function vare() {
      const { navn, treff } = vareData;
      const aktive = treff.filter(t => t.aktiv !== false);
      const iDine = t => !valgte.size || !(t.klasser || []).length || t.klasser.some(k => valgte.has(k));
      const lik = t => norm(t.merke) === norm(navn);
      const relevante = aktive.filter(iDine);
      const se = [SOK_URL.vare(navn), 'Se varemerket hos Patentstyret'];
      const veil = [LENKE.veiledning, 'Få veiledning fra Patentstyret'];
      const saer = [LENKE.saerpreg, 'Les om særpreg og forvekslingsfare'];

      if (!aktive.length) return { tone: 'noytral', tittel: 'Ingen like varemerker er registrert', tekst: 'Når du søker, vurderer Patentstyret også selve navnet – blant annet om det skiller seg ut.', steg: [[LENKE.soknad, 'Slik søker du varemerke'], saer] };

      const valg = `<div class="omr" role="group" aria-labelledby="omr-t">
        <span class="omr-tittel" id="omr-t">Hva skal du bruke navnet til?</span>
        <div class="omr-valg">${KATEGORIER.map((c, i) => `<button type="button" data-kat="${i}" aria-pressed="${katValgt.has(i)}">${esc(c.navn)}</button>`).join('')}</div>
      </div>`;
      const vis = [...aktive].sort((a, b) => (iDine(b) - iDine(a)) || (lik(b) - lik(a))).slice(0, 3);
      const detaljer = `<ul class="treff">${vis.map(t => {
        const kl = (t.klasser || []).slice().sort((a, b) => a - b);
        const klTekst = kl.length > 4 ? `${kl.length} klasser` : kl.length ? `Klasse ${kl.join(', ')}` : '';
        const merk = valgte.size ? (iDine(t) ? 'Gjelder det du valgte' : 'Andre varer') : (lik(t) ? 'Likt navn' : 'Lignende navn');
        return `<li><span><span class="navn">${esc(t.merke)}</span><span class="meta">${[t.eier, klTekst].filter(Boolean).map(esc).join(' · ')}</span></span><span class="merk${valgte.size && iDine(t) ? ' din' : ''}">${merk}</span></li>`;
      }).join('')}</ul>${aktive.length > vis.length ? `<p class="treff-mer">Viser ${vis.length} av ${aktive.length}.</p>` : ''}`;

      if (!valgte.size) return { tone: 'sjekk', tittel: aktive.some(lik) ? 'Navnet er registrert som varemerke' : 'Et lignende varemerke finnes', tekst: 'Om det hindrer deg, avhenger av hva du skal bruke navnet til.', ekstra: valg, detaljer, steg: [se] };
      if (relevante.some(lik)) return { tone: 'stopp', tittel: 'Et likt varemerke finnes for det du skal selge', tekst: 'Da kan du trolig ikke registrere navnet. En tydelig annen variant kan være veien videre.', ekstra: valg, detaljer, steg: [se, veil] };
      if (relevante.length) return { tone: 'sjekk', tittel: 'Et lignende varemerke finnes for det du skal selge', tekst: 'Patentstyret vurderer om navnene kan forveksles – hvor like de er, og hvor like varene er.', ekstra: valg, detaljer, steg: [se, veil, saer] };
      return { tone: 'noytral', tittel: `Et ${aktive.some(lik) ? 'likt' : 'lignende'} varemerke finnes for andre varer`, tekst: 'Det gjelder andre varer enn de du valgte, men kan likevel være verdt å se på.', ekstra: valg, detaljer, steg: [se, veil, saer] };
    }
    function tegnVare() {
      const apen = document.querySelector('#kort-vare details')?.open;
      const s = vare(); s.apen = apen; sett('vare', s);
    }
    document.addEventListener('click', e => {
      const b = e.target.closest('[data-kat]'); if (!b) return;
      const i = +b.dataset.kat;
      katValgt.has(i) ? katValgt.delete(i) : katValgt.add(i);
      valgte = new Set([...katValgt].flatMap(j => KATEGORIER[j].k));
      tegnVare();
      document.querySelector(`#kort-vare [data-kat="${i}"]`)?.focus();
    });

    /* Søk */
    const res = document.getElementById('resultater'), feil = document.getElementById('sokFeil'), felt = document.getElementById('sokFelt');
    let sokNr = 0;
    function sok(navn) {
      navn = navn.trim();
      if (!navn) { feil.textContent = 'Skriv inn et navn først.'; felt.focus(); return; }
      if (navn.length > 100) { feil.textContent = 'Navnet kan ha maks 100 tegn.'; return; }
      feil.textContent = '';
      const nr = ++sokNr, aktuell = () => nr === sokNr;
      katValgt = new Set(); valgte = new Set(); vareData = null;
      res.innerHTML = lasterHtml('domene') + lasterHtml('foretak') + lasterHtml('vare');
      res.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
      history.replaceState(null, '', `?navn=${encodeURIComponent(navn)}${params.has('demo') ? '&demo=' + params.get('demo') : ''}`);

      hent('domene', navn).then(d => aktuell() && sett('domene', domene(d, navn)))
        .catch(() => aktuell() && sett('domene', ukjent('domenet', 'Norid', SOK_URL.domene(navn.toLowerCase().replace(/\s+/g, '-') + '.no'))));
      hent('foretak', navn).then(d => aktuell() && sett('foretak', foretak(d, navn)))
        .catch(() => aktuell() && sett('foretak', ukjent('foretaksnavnet', 'Brønnøysundregistrene', SOK_URL.foretak(navn))));
      (demo ? demoVare(navn) : hent('varemerke', navn)).then(d => {
        if (!aktuell()) return;
        // Uten API-nøkkel svarer tjenesten «simulert» – da viser vi at vi ikke fikk sjekket, i stedet for et falskt «ingen treff»
        if (d.simulert && !demo) throw new Error('simulert');
        vareData = { navn, treff: d.treff || [] }; tegnVare();
      }).catch(() => aktuell() && sett('vare', ukjent('varemerket', 'Patentstyret', SOK_URL.vare(navn))));
    }
    document.getElementById('sokForm').addEventListener('submit', e => { e.preventDefault(); sok(felt.value); });
    felt.addEventListener('input', () => { feil.textContent = ''; });
    // Lenke rett til et søk: /minimum/?navn=Fjellbris
    if (params.get('navn')) { felt.value = params.get('navn'); sok(felt.value); }
  </script>
</body>
</html>
